---

version: "2"
run:
  concurrency: 4
  tests: true
  build-tags: test
linters:
  enable:
    - bodyclose
    - cyclop
    - dupl
    - errorlint
    - goconst
    - goprintffuncname
    - gosec
    - misspell
    - nestif
    - noctx
    - revive
    - staticcheck
    - whitespace
    - ireturn
    - errname
  disable:
    - depguard
    - exhaustive
    - nlreturn
    - wrapcheck
    - wsl
  settings:
    cyclop:
      max-complexity: 20
    dupl:
      threshold: 250
    errcheck:
      check-type-assertions: true
      check-blank: true
      exclude-functions:
        - io/ioutil.ReadFile
        - io.Copy(*bytes.Buffer)
        - io.Copy(os.Stdout)
    funlen:
      lines: 100
      statements: 50
    gocognit:
      min-complexity: 15
    goconst:
      min-len: 3
      min-occurrences: 3
    gocritic:
      enabled-tags:
        - diagnostic
        - experimental
        - opinionated
        - performance
        - style
    gocyclo:
      min-complexity: 15
    lll:
      line-length: 120
    misspell:
      locale: UK
      mode: restricted
      ignore-rules:
        - organization
        - organizations
    nolintlint:
      require-explanation: true
      require-specific: true
      allow-unused: false
    revive:
      rules:
        - name: exported
          arguments:
            - checkPrivateReceivers
            - sayRepetitiveInsteadOfStutters
          disabled: false
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - linters:
          - dupl
          - errcheck
          - funlen
          - gocyclo
          - gosec
        path: .*_test\\.go$"
      - linters:
          - lll
        source: '^//go:generate '
      - linters:
          - godot
        text: ^\s*// [A-Z].*[^.]$
    paths:
      - third_party$
      - builtin$
      - examples$
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
formatters:
  enable:
    - gofumpt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/nentgroup/viaplay-cli
    gofumpt:
      module-path: github.com/nentgroup/viaplay-cli
      extra-rules: true
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$

...