version: '3'

env:
  PLATFORM: local
  APP_NAME: vip
  GO_VERSION: '1.24'
  DOCKER_REGISTRY: docker-registry.dev.mtg-api.com

vars:
  CURRENT_DATE:
    sh: date +"%Y-%m-%d"

tasks:
  build:
    desc: Build binaries for multiple platforms (runs in parallel)
    deps:
      - build:linux-amd64
      - build:linux-arm64
      - build:windows-amd64
      - build:windows-arm64
      - build:darwin-amd64
      - build:darwin-arm64
    cmds:
      - echo "✅ Binaries built successfully"

  build:bin:
    internal: true
    cmds:
      - mkdir -p bin
    status:
      - test -d bin

  build:linux-amd64:
    internal: true
    deps: [build:bin]
    cmds:
      - CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o bin/{{.APP_NAME}}_linux_amd64 cmd/{{.APP_NAME}}/main.go

  build:linux-arm64:
    internal: true
    deps: [build:bin]
    cmds:
      - CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -o bin/{{.APP_NAME}}_linux_arm64 cmd/{{.APP_NAME}}/main.go

  build:windows-amd64:
    internal: true
    deps: [build:bin]
    cmds:
      - CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -o bin/{{.APP_NAME}}_windows_amd64.exe cmd/{{.APP_NAME}}/main.go

  build:windows-arm64:
    internal: true
    deps: [build:bin]
    cmds:
      - CGO_ENABLED=0 GOOS=windows GOARCH=arm64 go build -o bin/{{.APP_NAME}}_windows_arm64.exe cmd/{{.APP_NAME}}/main.go

  build:darwin-amd64:
    internal: true
    deps: [build:bin]
    cmds:
      - CGO_ENABLED=0 GOOS=darwin GOARCH=amd64 go build -o bin/{{.APP_NAME}}_darwin_amd64 cmd/{{.APP_NAME}}/main.go

  build:darwin-arm64:
    internal: true
    deps: [build:bin]
    cmds:
      - CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build -o bin/{{.APP_NAME}}_darwin_arm64 cmd/{{.APP_NAME}}/main.go

  setup:lefthook:
    desc: Install and configure lefthook for git hooks
    cmds:
      - echo "Setting up lefthook git hooks"
      - chmod +x scripts/setup.sh
      - ./scripts/setup.sh
      - echo "✅ Lefthook setup complete"

  setup:
    desc: Setup everything needed for development
    deps:
      - setup:lefthook
      - deps:install
    cmds:
      - echo "✅ Development environment setup complete"

  lint:
    desc: run linters
    cmds:
      - golangci-lint run --allow-parallel-runners --fix
      - actionlint

  deps:update:
    desc: Check for dependency updates
    cmds:
      - echo "Checking for dependency updates"
      - go get -u ./...
      - go mod tidy
      - echo "✅ Dependencies updated"

  deps:install:
    desc: Install all dependencies
    cmds:
      - echo "Installing dependencies"
      - go mod download
      - go mod tidy
      - echo "✅ Dependencies installed"

  test:coverage:
    desc: Run tests with coverage report
    cmds:
      - echo "Running tests with coverage report"
      - mkdir -p coverage
      - go test -tags=test -v ./... -coverprofile=coverage/coverage.out -covermode=atomic -coverpkg=./... -race
      - go tool cover -html=coverage/coverage.out -o coverage/coverage.html
      - echo "✅ Coverage report generated at coverage/coverage.html"

  clean:
    desc: Clean build artifacts
    cmds:
      - echo "Cleaning build artifacts and caches"
      - rm -rf bin/*
      - rm -rf release/*
      - rm -rf coverage/*
      - go clean -cache -testcache
      - echo "✅ Cleaned build artifacts"

  help:
    desc: Show available tasks
    cmds:
      - echo "Available tasks:"
      - task --list

  vip:
    desc: Run vip with passthrough args
    cmds:
      - go run ./cmd/{{.APP_NAME}} {{.CLI_ARGS}}

  vip:repo:apply:
    desc: Apply repo config to an existing repo
    cmds:
      - go run ./cmd/{{.APP_NAME}} repo apply {{.CLI_ARGS}}

  vip:repo:apply:secret:
    desc: Apply one secret to an existing repo
    cmds:
      - go run ./cmd/{{.APP_NAME}} repo apply secret {{.CLI_ARGS}}

  vip:repo:apply:variable:
    desc: Apply one variable to an existing repo
    cmds:
      - go run ./cmd/{{.APP_NAME}} repo apply variable {{.CLI_ARGS}}

  install:local:
    desc: Build and install a vip-dev binary locally (separate from a real 'vip' release install)
    vars:
      GIT_COMMIT:
        sh: git rev-parse --short HEAD
      BUILD_DATE:
        sh: date -u +"%Y-%m-%dT%H:%M:%SZ"
      GOBIN:
        sh: go env GOBIN
      GOPATH:
        sh: go env GOPATH
      INSTALL_DIR: '{{if .GOBIN}}{{.GOBIN}}{{else}}{{.GOPATH}}/bin{{end}}'
    cmds:
      - mkdir -p {{.INSTALL_DIR}}
      - echo "Building viaplay-cli (dev-{{.GIT_COMMIT}}) as '{{.APP_NAME}}-dev' in {{.INSTALL_DIR}}"
      - >-
        go build -o {{.INSTALL_DIR}}/{{.APP_NAME}}-dev -ldflags="
        -X github.com/nentgroup/viaplay-cli/internal/cli.Version=dev-{{.GIT_COMMIT}}
        -X github.com/nentgroup/viaplay-cli/internal/cli.BuildDate={{.BUILD_DATE}}
        -X github.com/nentgroup/viaplay-cli/internal/cli.Commit={{.GIT_COMMIT}}"
        ./cmd/{{.APP_NAME}}
      - echo "✅ Installed successfully. Run '{{.APP_NAME}}-dev version' to confirm, then '{{.APP_NAME}}-dev' to use the tool."

  graphify:build:
    desc: Build/refresh the graphify-rs knowledge graph for this repo
    cmds:
      - graphify-rs build --no-llm --output graphify-rs-out
  graphify:serve:
    desc: Start the graphify-rs MCP server for agentic coding tools
    cmds:
      - graphify-rs serve --graph graphify-rs-out/graph.json