# Example environment configuration
# This file defines the environment settings for staging deployments.
# See http://nentgroup.github.io/viaplay-cli/#/envs

name: stage
wait_timer: 0
{{{if .IsTeam}}}
reviewers:
  - type: Team
    id: {{.Org.TeamID}}
{{{ end }}}
deployment_branch_policy:
  protected_branches: false
  custom_branch_policies: true
  branch_patterns:
    - name: main              # This represents a DeploymentBranchPolicyRequest
      type: branch            # Values could be "branch" or "tag"
    - name: "release/*"       # Another pattern example
      type: branch
    - name: "*"
      type: tag
