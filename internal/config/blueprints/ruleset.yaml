# Example GitHub branch ruleset
# This file defines a ruleset for GitHub repositories
# It supports template variables like {{.Org.TeamID}} for dynamic values
# See http://nentgroup.github.io/viaplay-cli/#/rulesets
# ! Your rulesets won't be enforced on private repositories until you move to GitHub Team organization account.
# https://docs.github.com/en/repositories/configuring-branches-and-merges-in-your-repository/managing-rulesets/about-rulesets

name: branch-protection
target: branch
enforcement: active
{{{if .IsTeam}}}
# You can use template variables for dynamic values
bypass_actors:
  - actor_id: {{.Org.TeamID}}
    actor_type: Team
    bypass_mode: always
{{{end}}}
conditions:
  ref_name:
    include:
      - refs/heads/main
    exclude: []

rules:
  - type: require_pull_request
    parameters:
      required_approving_review_count: 1
      require_code_owner_review: true
      dismiss_stale_reviews_on_push: true
      require_last_push_approval: false
      allowed_merge_methods:
        - squash
        - rebase

  - type: required_status_checks
    parameters:
      strict_required_status_checks_policy: true
      required_status_checks:
        - context: ci/build
        - context: ci/test

  - type: non_fast_forward
    parameters: {}
