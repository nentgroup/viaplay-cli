name: Bug report
description: Report a bug or unexpected behavior
title: ""
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Please provide as much detail as possible.
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the bug and the effect you saw.
      placeholder: The CLI crashes when...
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: List the exact steps to reproduce the issue.
      placeholder: |
        1. Run `vip ...`
        2. Provide ...
        3. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: version
    attributes:
      label: Environment
      description: Include OS, Go version, and CLI version if known.
      placeholder: |
        OS: macOS 15
        Go: 1.27
        VIP version: v0.1.0
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs / output
      description: Paste command output, stack traces, or screenshots if relevant.
      render: shell
